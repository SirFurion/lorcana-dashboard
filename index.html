<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Lorcana - Collection Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090d16;
            --panel-bg: rgba(13, 19, 33, 0.95);
            --gold: #f3ce78;
            --gold-light: #ffebad;
            --gold-dark: #9a7b38;
            --accent-blue: #2259ec;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 20%, #17233f 0%, #090d16 80%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .scroll-container {
            width: 100%;
            max-width: 980px;
            background: var(--panel-bg);
            border: 3px solid var(--gold);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(243, 206, 120, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 25px 20px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(243, 206, 120, 0.3);
            padding-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .main-logo {
            max-width: 280px;
            width: 80%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(243, 206, 120, 0.5));
            margin-bottom: 6px;
        }

        .sub-header-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            font-weight: 700;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--gold-light);
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Bloc Jauge Globale */
        .global-progress-box {
            background: linear-gradient(135deg, rgba(23,35,63,0.9), rgba(10,15,26,0.95));
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .progress-bar-bg {
            background: #050811;
            border: 2px solid var(--gold-dark);
            border-radius: 30px;
            height: 26px;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #1b3db7, #2259ec, var(--gold));
            height: 100%;
            border-radius: 20px;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 15px rgba(34, 89, 236, 0.6);
        }

        .progress-text {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        /* Années et Chapitres (Centrés) */
        .year-section {
            margin-bottom: 20px;
            background: rgba(10, 15, 26, 0.6);
            border: 1px solid rgba(243, 206, 120, 0.15);
            border-radius: 10px;
            padding: 12px;
        }

        .year-title {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: var(--gold);
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(243, 206, 120, 0.2);
            padding-bottom: 5px;
            text-align: center;
        }

        .chapters-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .chapter-card {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(243, 206, 120, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 170px;
            max-width: 210px;
        }

        .chapter-card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            background: rgba(23, 35, 63, 0.9);
        }

        .chapter-card.selected {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(243, 206, 120, 0.8);
            background: linear-gradient(135deg, rgba(35, 50, 85, 0.9), rgba(15, 23, 42, 0.9));
        }

        /* Effet visuel 100% complété */
        .chapter-card.completed-100 {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(243, 206, 120, 0.4);
            background: linear-gradient(135deg, rgba(45, 38, 15, 0.85), rgba(15, 23, 42, 0.9));
        }

        .chapter-card.completed-100.selected {
            box-shadow: 0 0 20px rgba(243, 206, 120, 0.9);
        }

        /* Style spécifique Chapitre To Be Released */
        .chapter-card.tba {
            opacity: 0.65;
            border-style: dashed;
        }
        .chapter-card.tba:hover {
            opacity: 1;
        }

        .chapter-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            margin-bottom: 2px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chapter-icon {
            width: 100%;
            max-width: 85px;
            height: 42px;
            object-fit: contain;
            margin: 4px 0 8px 0;
            filter: drop-shadow(0 2px 6px rgba(243, 206, 120, 0.4));
        }

        .chapter-bar-container {
            width: 100%;
            background: #04060b;
            border: 1px solid var(--gold-dark);
            border-radius: 20px;
            height: 14px;
            position: relative;
            overflow: hidden;
            margin: 4px 0;
            padding: 1px;
        }

        .chapter-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1b3db7, var(--gold));
            border-radius: 10px;
            transition: width 0.8s ease;
        }

        .chapter-stats {
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 700;
            margin-top: 2px;
        }

        /* Section Détails Raretés & Grand Visuel */
        .rarities-box {
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(10,15,26,0.95));
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 18px;
            margin-top: 25px;
        }

        .details-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(243, 206, 120, 0.2);
            padding-bottom: 10px;
        }

        .details-large-icon {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(243, 206, 120, 0.7));
            display: none;
        }

        /* Organisation sur 2 lignes pour les raretés */
        .rarities-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .rarities-row-flex {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .rarity-card {
            background: rgba(5, 8, 17, 0.7);
            border: 1px solid rgba(243, 206, 120, 0.2);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 115px;
            max-width: 145px;
        }

        .rarity-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
        }

        .rarity-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
        }

        .rarity-value {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--gold);
        }

        .reset-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--gold-light);
            margin-top: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Section Quête des Illumineurs */
        .quest-box {
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(10,15,26,0.95));
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 18px;
            margin-top: 25px;
        }

        .quest-cards-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .quest-card {
            background: rgba(5, 8, 17, 0.8);
            border: 2px solid rgba(243, 206, 120, 0.25);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 180px;
            max-width: 240px;
            position: relative;
            transition: all 0.3s ease;
        }

        .quest-card.owned {
            border-color: var(--gold);
            background: linear-gradient(135deg, rgba(45, 38, 15, 0.85), rgba(15, 23, 42, 0.95));
            box-shadow: 0 0 15px rgba(243, 206, 120, 0.4);
        }

        .quest-card-img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
        }

        .quest-card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quest-status-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 4px;
        }

        .quest-status-badge.status-owned {
            background: rgba(243, 206, 120, 0.2);
            color: var(--gold-light);
            border: 1px solid var(--gold);
        }

        .quest-status-badge.status-missing {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sync-status {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="scroll-container">
        <header>
            <img src="https://raw.githubusercontent.com/SirFurion/lorcana-dashboard/refs/heads/main/assets/images/Disney-_Lorcana_-_Logo.png" alt="Disney Lorcana Logo" class="main-logo">
            <div class="sub-header-title">Dashboard</div>
        </header>

        <!-- Jauge Globale -->
        <div class="global-progress-box">
            <div class="section-title">Progression Globale de la Collection</div>
            <div class="progress-bar-bg">
                <div id="global-fill" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <div class="progress-text"><span id="global-numbers">Chargement...</span> (<span id="global-percent">0%</span>)</div>
        </div>

        <div class="section-title">Suivi par Année &
